       data-description="Gerade in Krisensituationen sind die Menschen auf die Hilfe aus ihrem direkten Umfeld angewiesen. Um die 
                            Hilfe möglichst gut koordinieren und organisieren zu können wurde eine Hochwasser-App (Holtz, 2020) um eine Nachbarschaftshilfe-Komponente erweitert. Um eine einfache und schnelle Hilfe gewährleisten zu können wurde Wert auf einen menschzentrierten Entwicklungsprozess gelegt. Dabei ist es wichtig passende Information an die richtigen Nutzer:innen zu senden. Dazu wurde die Komponente mit der Möglichkeit Hilfsangebote und Hilfegesuche zu erstellen, Benachrichtigungszeiträume festzulegen und auf Beiträge zu antworten entwickelt. Abschließend wurde die Applikation mit Bürger:innen Lübecks evaluiert.
